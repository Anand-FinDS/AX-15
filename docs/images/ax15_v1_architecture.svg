<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="780" viewBox="0 0 1560 780" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker></defs>
<rect width="1560" height="780" fill="#FFFFFF"/><text x="60" y="70" text-anchor="start" font-size="34" font-weight="700" fill="#1F2433">AX-15 1.0 — one agent in a loop (ReAct)</text><text x="60" y="108" text-anchor="start" font-size="19" font-weight="400" fill="#6B7280">Plain Anthropic Python SDK · Claude Haiku 5.5 · the model chooses which tool to call, turn by turn</text><rect x="60" y="190" width="200" height="110" rx="14" fill="#F2F5F7"/><text x="160.0" y="227.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2433">Ticket</text><text x="160.0" y="259.0" text-anchor="middle" font-size="17" fill="#1F2433">loaded by code,</text><text x="160.0" y="285.0" text-anchor="middle" font-size="17" fill="#1F2433">labels removed</text><line x1="262" y1="245" x2="338" y2="245" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="345" y="170" width="330" height="150" rx="14" fill="#111B33"/><text x="510.0" y="227.0" text-anchor="middle" font-size="22" font-weight="700" fill="#A8F0CE">Claude Haiku 5.5</text><text x="510.0" y="259.0" text-anchor="middle" font-size="17" fill="#FFFFFF">reads the ticket and</text><text x="510.0" y="285.0" text-anchor="middle" font-size="17" fill="#FFFFFF">decides the next step</text><line x1="460" y1="322" x2="460" y2="428" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><line x1="560" y1="428" x2="560" y2="322" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><text x="445" y="385" text-anchor="end" font-size="16" font-weight="400" fill="#6B7280" font-style="italic">calls a tool</text><text x="575" y="385" text-anchor="start" font-size="16" font-weight="400" fill="#6B7280" font-style="italic">reads the result</text><rect x="345" y="430" width="330" height="130" rx="14" fill="#E6F8EF"/><text x="510.0" y="477.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6F66">7 read-only tools</text><text x="510.0" y="509.0" text-anchor="middle" font-size="17" fill="#1F2433">store, asset, store devices, recent</text><text x="510.0" y="535.0" text-anchor="middle" font-size="17" fill="#1F2433">tickets, SLA, KB route, KB section</text><text x="510" y="600" text-anchor="middle" font-size="17" font-weight="400" fill="#6B7280" font-style="italic">repeat until it answers (max 12 tool calls, 180 s)</text><line x1="677" y1="245" x2="763" y2="245" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="770" y="180" width="300" height="130" rx="14" fill="#F2F5F7"/><text x="920.0" y="227.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2433">JSON answer</text><text x="920.0" y="259.0" text-anchor="middle" font-size="17" fill="#1F2433">routing, priority, steps,</text><text x="920.0" y="285.0" text-anchor="middle" font-size="17" fill="#1F2433">reply · schema checked</text><line x1="1072" y1="245" x2="1158" y2="245" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="1165" y="170" width="330" height="150" rx="14" fill="#FCEFE2"/><text x="1330.0" y="227.0" text-anchor="middle" font-size="22" font-weight="700" fill="#D9822B">Person</text><text x="1330.0" y="259.0" text-anchor="middle" font-size="17" fill="#1F2433">approves or rejects</text><text x="1330.0" y="285.0" text-anchor="middle" font-size="17" fill="#1F2433">the proposed action</text><line x1="1330" y1="322" x2="1330" y2="428" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="1165" y="430" width="330" height="130" rx="14" fill="#F2F5F7"/><text x="1330.0" y="477.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2433">Action log</text><text x="1330.0" y="509.0" text-anchor="middle" font-size="17" fill="#1F2433">written by code:</text><text x="1330.0" y="535.0" text-anchor="middle" font-size="17" fill="#1F2433">approver, time, trace id</text><rect x="60" y="650" width="1435" height="90" rx="14" fill="#F2F5F7"/><text x="85" y="690" text-anchor="start" font-size="18" font-weight="700" fill="#1F6F66">Shared base (same for 1.0 and 2.0):</text><text x="85" y="722" text-anchor="start" font-size="17" font-weight="400" fill="#1F2433">Neon Postgres data (stores, assets, SLA, tickets) · knowledge base (722 sections, vector + full text) · tools · tracing (Langfuse) · spend cap</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>