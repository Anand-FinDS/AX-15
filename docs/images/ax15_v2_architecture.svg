<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="880" viewBox="0 0 1580 880" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker></defs>
<rect width="1580" height="880" fill="#FFFFFF"/><text x="60" y="70" text-anchor="start" font-size="34" font-weight="700" fill="#1F2433">AX-15 2.0 — a governed agent suite on LangGraph</text><text x="60" y="108" text-anchor="start" font-size="19" font-weight="400" fill="#6B7280">The model reads and picks · SOP rules in code decide · a person approves · tools gather all evidence first, then the model reasons once</text><rect x="60" y="215" width="170" height="110" rx="14" fill="#F2F5F7"/><text x="145.0" y="252.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2433">Ticket</text><text x="145.0" y="284.0" text-anchor="middle" font-size="17" fill="#1F2433">console, CSV batch,</text><text x="145.0" y="310.0" text-anchor="middle" font-size="17" fill="#1F2433">JSON or text</text><line x1="232" y1="270" x2="282" y2="270" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="270" y="150" width="690" height="210" rx="18" fill="none" stroke="#1F6F66" stroke-width="2" stroke-dasharray="8 6"/><text x="286" y="178" text-anchor="start" font-size="18" font-weight="700" fill="#1F6F66">Triage agent</text><rect x="290" y="195" width="190" height="140" rx="14" fill="#E6F8EF"/><text x="385.0" y="234.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6F66">load + enrich</text><text x="385.0" y="266.0" text-anchor="middle" font-size="17" fill="#1F2433">7 tools: ticket, store,</text><text x="385.0" y="292.0" text-anchor="middle" font-size="17" fill="#1F2433">asset, devices, history,</text><text x="385.0" y="318.0" text-anchor="middle" font-size="17" fill="#1F2433">SLA, past actions</text><line x1="482" y1="265" x2="522" y2="265" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="530" y="195" width="190" height="140" rx="14" fill="#111B33"/><text x="625.0" y="234.0" text-anchor="middle" font-size="22" font-weight="700" fill="#A8F0CE">classify</text><text x="625.0" y="266.0" text-anchor="middle" font-size="17" fill="#FFFFFF">model extracts facts:</text><text x="625.0" y="292.0" text-anchor="middle" font-size="17" fill="#FFFFFF">symptom, impact,</text><text x="625.0" y="318.0" text-anchor="middle" font-size="17" fill="#FFFFFF">safety, intents</text><line x1="722" y1="265" x2="762" y2="265" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="770" y="195" width="170" height="140" rx="14" fill="#E6F8EF"/><text x="855.0" y="234.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6F66">policy</text><text x="855.0" y="266.0" text-anchor="middle" font-size="17" fill="#1F2433">30 SOP rules</text><text x="855.0" y="292.0" text-anchor="middle" font-size="17" fill="#1F2433">in code: route</text><text x="855.0" y="318.0" text-anchor="middle" font-size="17" fill="#1F2433">+ priority, cited</text><line x1="962" y1="265" x2="1020" y2="265" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="1010" y="150" width="500" height="210" rx="18" fill="none" stroke="#1F6F66" stroke-width="2" stroke-dasharray="8 6"/><text x="1026" y="178" text-anchor="start" font-size="18" font-weight="700" fill="#1F6F66">Resolution agent</text><rect x="1030" y="195" width="220" height="140" rx="14" fill="#111B33"/><text x="1140.0" y="234.0" text-anchor="middle" font-size="22" font-weight="700" fill="#A8F0CE">route</text><text x="1140.0" y="266.0" text-anchor="middle" font-size="17" fill="#FFFFFF">search: top 3 runbooks</text><text x="1140.0" y="292.0" text-anchor="middle" font-size="17" fill="#FFFFFF">model picks 1</text><text x="1140.0" y="318.0" text-anchor="middle" font-size="17" fill="#FFFFFF">or “none fits” → L2</text><line x1="1252" y1="265" x2="1282" y2="265" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="1290" y="195" width="200" height="140" rx="14" fill="#111B33"/><text x="1390.0" y="234.0" text-anchor="middle" font-size="22" font-weight="700" fill="#A8F0CE">resolve</text><text x="1390.0" y="266.0" text-anchor="middle" font-size="17" fill="#FFFFFF">model picks step ids</text><text x="1390.0" y="292.0" text-anchor="middle" font-size="17" fill="#FFFFFF">from that runbook;</text><text x="1390.0" y="318.0" text-anchor="middle" font-size="17" fill="#FFFFFF">never writes steps</text><path d="M 1390 337 L 1390 448" fill="none" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="1340" y="450" width="180" height="140" rx="14" fill="#E6F8EF"/><text x="1430.0" y="502.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6F66">decide</text><text x="1430.0" y="534.0" text-anchor="middle" font-size="17" fill="#1F2433">code: final L1/L2,</text><text x="1430.0" y="560.0" text-anchor="middle" font-size="17" fill="#1F2433">priority, steps</text><line x1="1338" y1="525" x2="1290" y2="525" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="1040" y="415" width="240" height="210" rx="18" fill="none" stroke="#1F6F66" stroke-width="2" stroke-dasharray="8 6"/><text x="1056" y="443" text-anchor="start" font-size="18" font-weight="700" fill="#1F6F66">Communication agent</text><rect x="1060" y="460" width="200" height="140" rx="14" fill="#111B33"/><text x="1160.0" y="499.0" text-anchor="middle" font-size="22" font-weight="700" fill="#A8F0CE">compose</text><text x="1160.0" y="531.0" text-anchor="middle" font-size="17" fill="#FFFFFF">model writes the store</text><text x="1160.0" y="557.0" text-anchor="middle" font-size="17" fill="#FFFFFF">reply and L2 note,</text><text x="1160.0" y="583.0" text-anchor="middle" font-size="17" fill="#FFFFFF">never steps</text><line x1="1058" y1="530" x2="988" y2="530" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="790" y="460" width="190" height="140" rx="14" fill="#E6F8EF"/><text x="885.0" y="499.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6F66">guard</text><text x="885.0" y="531.0" text-anchor="middle" font-size="17" fill="#1F2433">steps verbatim, ids in</text><text x="885.0" y="557.0" text-anchor="middle" font-size="17" fill="#1F2433">sources, no L2-only</text><text x="885.0" y="583.0" text-anchor="middle" font-size="17" fill="#1F2433">text; safety message</text><line x1="788" y1="530" x2="718" y2="530" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="480" y="450" width="230" height="160" rx="14" fill="#FCEFE2"/><text x="595.0" y="499.0" text-anchor="middle" font-size="22" font-weight="700" fill="#D9822B">human review</text><text x="595.0" y="531.0" text-anchor="middle" font-size="17" fill="#1F2433">graph pauses;</text><text x="595.0" y="557.0" text-anchor="middle" font-size="17" fill="#1F2433">Approve / Reject resumes</text><text x="595.0" y="583.0" text-anchor="middle" font-size="17" fill="#1F2433">from Postgres checkpoint</text><line x1="478" y1="530" x2="408" y2="530" stroke="#6B7280" stroke-width="2.5" marker-end="url(#a)"/><rect x="190" y="460" width="210" height="140" rx="14" fill="#F2F5F7"/><text x="295.0" y="499.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2433">action log</text><text x="295.0" y="531.0" text-anchor="middle" font-size="17" fill="#1F2433">ticket update or</text><text x="295.0" y="557.0" text-anchor="middle" font-size="17" fill="#1F2433">L2 escalation, with</text><text x="295.0" y="583.0" text-anchor="middle" font-size="17" fill="#1F2433">approver + trace id</text><path d="M 855 337 L 855 400 L 1480 400 L 1480 448" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="870" y="390" text-anchor="start" font-size="15" font-weight="400" fill="#6B7280" font-style="italic">shortcut: closed, safety, not-IT, clarify skip route/resolve</text><rect x="60" y="680" width="700" height="110" rx="14" fill="#F2F5F7"/><text x="85" y="718" text-anchor="start" font-size="19" font-weight="700" fill="#1F6F66">Neon Postgres + pgvector</text><text x="85" y="748" text-anchor="start" font-size="16" font-weight="400" fill="#1F2433">stores · 477 assets · SLA matrix · tickets · action log · checkpoints</text><text x="85" y="774" text-anchor="start" font-size="16" font-weight="400" fill="#1F2433">knowledge base: 48 docs, 722 sections, vector + full-text search</text><rect x="790" y="680" width="730" height="110" rx="14" fill="#111B33"/><text x="815" y="718" text-anchor="start" font-size="19" font-weight="700" fill="#A8F0CE">Trust layer around every run</text><text x="815" y="748" text-anchor="start" font-size="16" font-weight="400" fill="#FFFFFF">Langfuse trace per node, tool and model call · spend cap · GPT-6 Luna fallback</text><text x="815" y="774" text-anchor="start" font-size="16" font-weight="400" fill="#FFFFFF">fail safe: any model failure → L2 · labels never reach a prompt</text><rect x="60" y="826" width="26" height="26" rx="6" fill="#111B33" stroke="#D1D5DB"/><text x="96" y="846" text-anchor="start" font-size="17" font-weight="400" fill="#1F2433">model role</text><rect x="250" y="826" width="26" height="26" rx="6" fill="#E6F8EF" stroke="#D1D5DB"/><text x="286" y="846" text-anchor="start" font-size="17" font-weight="400" fill="#1F2433">code</text><rect x="440" y="826" width="26" height="26" rx="6" fill="#FCEFE2" stroke="#D1D5DB"/><text x="476" y="846" text-anchor="start" font-size="17" font-weight="400" fill="#1F2433">person</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>